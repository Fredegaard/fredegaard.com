    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        }
    </script>
    <script src="https://cdn.usefathom.com/script.js" data-site="OHYXRYPO" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script>
        document.addEventListener('alpine:init', () => {
            const preferDarkMode = () => matchMedia('(prefers-color-scheme: dark)').matches

            Alpine.data('theme', () => ({
                dark: localStorage.theme === 'dark' || (!('theme' in localStorage) && preferDarkMode()),

                init() {
                    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                        if (!('theme' in localStorage)) this.dark = e.matches
                    })
                },

                toggle() {
                    this.dark = !this.dark
                    localStorage.theme = this.dark ? 'dark' : 'light'
                },

                followSystem() {
                    delete localStorage.theme
                    this.dark = preferDarkMode()
                }
            }))
        })
    </script>
</head>
